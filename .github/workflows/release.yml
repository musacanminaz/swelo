name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for arch in arm64 amd64; do
            d="swelo_${v}_darwin_${arch}"
            mkdir -p "$d"
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/musacanminaz/swelo/internal/cli.Version=${v}" \
              -o "$d/swelo" ./cmd/swelo
            cp README.md LICENSE "$d/"
            tar -czf "out/$d.tar.gz" "$d"
          done
          (cd out && shasum -a 256 *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
